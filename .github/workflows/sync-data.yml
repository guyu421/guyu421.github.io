name: 同步数据库数据

on:
  push:
    paths:
      - "db/**.parquet"
      - "tools/export_json.py"
      - "tools/renju_predict/**"
      - ".github/workflows/sync-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pandas pyarrow whr lightgbm scikit-learn

      - name: 编译 WHR C 内核
        run: gcc -O3 -shared -fPIC tools/renju_predict/whr_kernel.c -o tools/renju_predict/whr_kernel.so -lm

      - name: 重新训练预测模型
        run: python tools/renju_predict/train.py --db-dir db --models-dir tools/renju_predict/models

      - name: 从 db/*.parquet 导出 data/*.json
        run: python tools/export_json.py

      - name: 提交并推送
        env:
          TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tools/renju_predict/models
          if git diff --cached --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "同步数据库数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
