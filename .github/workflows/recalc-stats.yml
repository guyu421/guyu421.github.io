name: 重算 WHR 等级分与模型评估

on:
  workflow_dispatch:
  repository_dispatch:
    types: [recalc-stats]

concurrency:
  group: recalc-stats
  cancel-in-progress: true

jobs:
  recalc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: renju
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与 PostgreSQL 客户端
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client unzip
          pip install pandas pyarrow whr scikit-learn lightgbm psycopg2-binary

      - name: 编译 WHR C 内核
        run: gcc -O3 -shared -fPIC tools/renju_predict/whr_kernel.c -o tools/renju_predict/whr_kernel.so -lm

      - name: 从服务器下载并导入 PostgreSQL 备份
        run: |
          curl -fsSL https://66-42-93-24.sslip.io/api/admin/db.zip -o /tmp/renju_db.zip
          unzip -q /tmp/renju_db.zip -d /tmp/sql
          PGPASSWORD="" psql -h 127.0.0.1 -U postgres -d renju -q -f /tmp/sql/renju.sql

      - name: 导出临时 Parquet 并重训预测模型
        run: |
          python tools/recalc_server.py --pg-dsn "host=127.0.0.1 dbname=renju user=postgres" --export-only --db-dir /tmp/db
          python tools/renju_predict/train.py --db-dir /tmp/db --models-dir /tmp/models

      - name: 重算 WHR、胜率预测与模型评估并回传服务器
        env:
          RENJU_ADMIN_TOKEN: ${{ secrets.RENJU_ADMIN_TOKEN }}
        run: |
          python tools/recalc_server.py --db-dir /tmp/db --models-dir /tmp/models --api-url https://66-42-93-24.sslip.io/api/admin/update-stats
