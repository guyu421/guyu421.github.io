<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="description" content="MATCHDAY 英超赛程与预测。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23c8f45a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='700' font-size='38' fill='%23152005'%3EM%3C/text%3E%3C/svg%3E">
  <title>MATCHDAY — 英超赛程与预测</title>
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f0c;
      --panel: #121713;
      --panel-2: #181e19;
      --panel-3: #202720;
      --line: rgba(255,255,255,.085);
      --line-strong: rgba(255,255,255,.15);
      --text: #f2f5ef;
      --muted: #929d94;
      --muted-2: #68736b;
      --accent: #c8f45a;
      --accent-ink: #152005;
      --blue: #82aaff;
      --danger: #ff8b82;
      --radius: 18px;
      --font: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      --display: "Barlow Condensed", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 82% 4%, rgba(115,155,53,.10), transparent 26rem),
        var(--bg);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .container { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ===== 顶部导航 ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: rgba(11,15,12,.88);
      backdrop-filter: blur(18px);
    }
    .topbar-inner { height: 76px; display: flex; align-items: center; gap: 36px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; flex: 0 0 auto; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--accent-ink);
      background: var(--accent);
      transform: rotate(-5deg);
      box-shadow: 0 0 30px rgba(200,244,90,.12);
    }
    .brand-mark .icon { width: 22px; height: 22px; stroke-width: 2; }
    .brand-name { font-family: var(--display); font-size: 25px; font-weight: 800; letter-spacing: .6px; line-height: 1; }
    .brand-name span { color: var(--accent); }
    .main-nav { display: flex; height: 100%; gap: 28px; }
    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      padding: 0 2px;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .nav-link.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .search-box {
      width: 224px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      transition: border-color .2s, background .2s;
    }
    .search-box:focus-within { border-color: rgba(200,244,90,.45); background: rgba(255,255,255,.04); }
    .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 13px; }
    .search-box input::placeholder { color: var(--muted-2); }
    .search-key { border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 5px; color: var(--muted-2); font-size: 11px; line-height: 18px; }
    .service-pill { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .service-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(200,244,90,.08); }
    .service-pill.offline .service-dot { background: var(--danger); box-shadow: none; }

    /* ===== 联赛标题与日期 ===== */
    .league-head { padding: 42px 0 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 48px); line-height: 1.15; letter-spacing: -1.6px; }
    .league-sub { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .refresh-btn, .primary-btn, .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 11px;
      font-weight: 600;
      transition: transform .18s, background .18s, border-color .18s;
    }
    .refresh-btn { height: 42px; padding: 0 15px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); }
    .refresh-btn:hover, .ghost-btn:hover { border-color: rgba(200,244,90,.4); background: var(--panel-2); }
    .refresh-btn.loading .icon { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .date-wrap { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .date-strip { display: grid; grid-template-columns: 1.12fr repeat(7, 1fr); gap: 8px; padding: 14px 0; }
    .date-btn {
      min-width: 0;
      height: 66px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      transition: background .18s, color .18s, border-color .18s;
    }
    .date-btn:hover { background: rgba(255,255,255,.035); color: var(--text); }
    .date-btn.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    .date-day { display: block; font-size: 12px; font-weight: 600; }
    .date-num { display: block; margin-top: 3px; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: .4px; }
    .date-btn.active .date-num { color: var(--accent-ink); }

    /* ===== 赛程布局 ===== */
    .schedule-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 30px 0 44px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .fixture-panel { min-width: 0; overflow: hidden; }
    .fixture-toolbar { display: flex; align-items: center; gap: 20px; min-height: 66px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .filter-tabs { display: flex; align-items: center; gap: 22px; align-self: stretch; }
    .filter-tab { position: relative; border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 13px; font-weight: 600; }
    .filter-tab:hover, .filter-tab.active { color: var(--text); }
    .filter-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -23px; height: 2px; background: var(--accent); }
    .match-count { margin-left: auto; color: var(--muted-2); font-size: 12px; white-space: nowrap; }
    .group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 10px; }
    .group-title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 700; }
    .group-title .icon { width: 15px; height: 15px; color: var(--muted); }
    .group-tag { color: var(--muted-2); font-size: 11px; }
    .fixture-list { padding: 0 10px 10px; }
    .fixture-list.bare { padding-top: 10px; }
    .fixture-row {
      position: relative;
      display: grid;
      grid-template-columns: 82px minmax(230px, 1fr) minmax(210px, .78fr) 34px;
      align-items: center;
      gap: 16px;
      min-height: 112px;
      padding: 16px 10px;
      border-top: 1px solid var(--line);
      border-radius: 12px;
      transition: background .18s;
      cursor: pointer;
    }
    .fixture-row:hover { background: rgba(255,255,255,.025); }
    .kickoff { padding-left: 8px; }
    .kickoff-time { font-family: var(--display); font-size: 23px; font-weight: 700; letter-spacing: .3px; }
    .kickoff-meta { margin-top: 5px; color: var(--muted-2); font-size: 10px; letter-spacing: .4px; }
    .live-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--danger); font-size: 11px; font-weight: 700; }
    .live-tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .teams-stack { display: grid; gap: 12px; min-width: 0; }
    .team-line { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .team-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .team-en { margin-left: auto; color: var(--muted-2); font-family: var(--display); font-size: 12px; letter-spacing: .7px; }
    .club-badge {
      --club: #82918a;
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 38px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px 9px 12px 12px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--club) 76%, white), var(--club));
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.16);
      color: white;
      font-family: var(--display);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .5px;
      text-shadow: 0 1px 3px rgba(0,0,0,.65);
    }
    .club-badge::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.28); }
    .club-badge.large { width: 64px; height: 72px; border-radius: 16px 16px 21px 21px; font-size: 23px; box-shadow: inset 0 0 0 4px rgba(0,0,0,.14), 0 10px 28px rgba(0,0,0,.2); }
    .probabilities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .prob-item { padding: 8px 4px; border: 1px solid var(--line); border-radius: 9px; text-align: center; background: rgba(255,255,255,.018); }
    .prob-item.fav { border-color: rgba(200,244,90,.25); background: rgba(200,244,90,.055); }
    .prob-label { display: block; color: var(--muted-2); font-size: 9px; }
    .prob-value { display: block; margin-top: 2px; font-family: var(--display); font-size: 18px; font-weight: 700; }
    .prob-item.fav .prob-value { color: var(--accent); }
    .fav-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted-2); }
    .fav-btn:hover { color: var(--text); background: var(--panel-3); }
    .fav-btn.active { color: var(--accent); }
    .fav-btn.active .icon { fill: currentColor; }

    /* ===== 右侧内容 ===== */
    .side-stack { display: grid; gap: 18px; }
    .feature-card { position: relative; overflow: hidden; padding: 22px; background: linear-gradient(155deg, #1b2518 0%, #121713 64%); }
    .feature-card::before { content: ""; position: absolute; width: 220px; height: 220px; top: -140px; right: -80px; border-radius: 50%; background: var(--accent); filter: blur(80px); opacity: .11; pointer-events: none; }
    .feature-label { display: flex; align-items: center; justify-content: space-between; color: var(--accent); font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    .feature-label .icon { width: 16px; height: 16px; }
    .feature-teams { display: grid; grid-template-columns: 1fr 54px 1fr; align-items: center; gap: 6px; margin: 26px 0 22px; text-align: center; }
    .feature-team { min-width: 0; display: grid; justify-items: center; gap: 11px; }
    .feature-team-name { min-height: 42px; display: grid; place-items: center; font-size: 13px; font-weight: 700; line-height: 1.5; }
    .versus { color: var(--muted-2); font-family: var(--display); font-size: 22px; font-weight: 700; font-style: italic; }
    .feature-kickoff { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .feature-score { margin-bottom: 18px; padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: rgba(0,0,0,.13); text-align: center; }
    .feature-score-label { color: var(--muted); font-size: 10px; }
    .feature-score-value { margin-top: 2px; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: 2px; }
    .feature-score-value span { margin-left: 8px; color: var(--accent); font-size: 16px; letter-spacing: 0; }
    .primary-btn { width: 100%; min-height: 42px; padding: 0 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-size: 13px; }
    .primary-btn:hover { transform: translateY(-1px); background: #d4fa77; }
    .side-card { padding: 20px; }
    .side-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 17px; font-size: 13px; }
    .side-title span { color: var(--muted-2); font-size: 10px; font-weight: 400; }
    .model-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .model-stat { min-width: 0; }
    .model-stat strong { display: block; font-family: var(--display); font-size: 27px; line-height: 1; }
    .model-stat span { display: block; margin-top: 6px; color: var(--muted-2); font-size: 10px; white-space: nowrap; }
    .update-line { display: flex; align-items: center; gap: 7px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .update-line .icon { width: 13px; height: 13px; }
    .rank-list { display: grid; gap: 13px; }
    .rank-row { display: grid; grid-template-columns: 18px 28px minmax(0,1fr) auto; align-items: center; gap: 9px; border: 0; padding: 0; background: transparent; text-align: left; }
    .rank-row:hover .rank-name { color: var(--accent); }
    .rank-pos { color: var(--muted-2); font-family: var(--display); font-size: 15px; }
    .rank-row .club-badge { width: 26px; height: 29px; border-radius: 7px 7px 9px 9px; font-size: 10px; }
    .rank-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; transition: color .18s; }
    .rank-value { color: var(--accent); font-family: var(--display); font-size: 16px; }
    .disclaimer { display: flex; gap: 10px; padding: 4px 6px; color: var(--muted-2); font-size: 10px; line-height: 1.8; }
    .disclaimer .icon { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 2px; }

    /* ===== 状态、空态与页脚 ===== */
    .state-box { display: grid; justify-items: center; padding: 70px 24px; text-align: center; }
    .state-icon { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 17px; border: 1px solid var(--line); border-radius: 15px; color: var(--muted); background: var(--panel-2); }
    .state-icon .icon { width: 23px; height: 23px; }
    .state-title { margin: 0; font-size: 15px; }
    .state-text { max-width: 340px; margin: 8px 0 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .ghost-btn { min-height: 38px; padding: 0 14px; border: 1px solid var(--line-strong); background: transparent; font-size: 12px; }
    .skeleton { position: relative; overflow: hidden; background: var(--panel-2); border-radius: 7px; }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.045), transparent); animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .footer { border-top: 1px solid var(--line); }
    .footer-inner { min-height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted-2); font-size: 11px; }
    .footer-brand { color: var(--muted); font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: .6px; }
    .footer-note { text-align: right; line-height: 1.8; }

    /* ===== 单场预测详情 ===== */
    .modal-shell {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(2,5,3,.78);
      backdrop-filter: blur(6px);
    }
    .modal-shell[hidden] { display: none; }
    .match-dialog {
      width: min(780px, 100%);
      max-height: calc(100dvh - 36px);
      margin: 0;
      padding: 0;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      color: var(--text);
      background: #101511;
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
    }
    .dialog-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 17px 22px; border-bottom: 1px solid var(--line); background: rgba(16,21,17,.94); backdrop-filter: blur(15px); }
    .dialog-competition { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dialog-competition .icon { width: 16px; height: 16px; color: var(--accent); }
    .close-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--muted); }
    .close-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .dialog-body { padding: 26px; }
    .dialog-teams { display: grid; grid-template-columns: 1fr 110px 1fr; align-items: center; gap: 18px; padding: 10px 0 28px; text-align: center; }
    .dialog-team { display: grid; justify-items: center; gap: 13px; }
    .dialog-team-name { font-size: 17px; font-weight: 700; }
    .dialog-team-en { color: var(--muted-2); font-family: var(--display); font-size: 12px; letter-spacing: 1px; }
    .dialog-vs { font-family: var(--display); font-size: 34px; font-weight: 700; }
    .dialog-time { margin-top: 6px; color: var(--muted); font-size: 11px; }
    .dialog-section { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
    .dialog-section-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 16px; font-size: 13px; }
    .dialog-section-title span { color: var(--muted-2); font-size: 10px; font-weight: 400; }
    .xg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .xg-card { padding: 17px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .xg-label { color: var(--muted); font-size: 11px; }
    .xg-value { margin-top: 5px; font-family: var(--display); font-size: 34px; font-weight: 700; }
    .outcome-values { display: grid; grid-template-columns: repeat(3,1fr); margin-bottom: 12px; text-align: center; }
    .outcome-values span { display: block; color: var(--muted); font-size: 10px; }
    .outcome-values strong { display: block; margin-top: 4px; font-family: var(--display); font-size: 26px; }
    .outcome-bar { display: flex; height: 8px; gap: 3px; overflow: hidden; border-radius: 99px; }
    .outcome-bar div { min-width: 2px; }
    .outcome-home { background: var(--accent); }
    .outcome-draw { background: #59645c; }
    .outcome-away { background: var(--blue); }
    .scoreline-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .scoreline-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
    .scoreline-item strong { font-family: var(--display); font-size: 23px; }
    .scoreline-item span { color: var(--accent); font-family: var(--display); font-size: 17px; }
    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .market-item { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .market-top { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; }
    .market-top strong { color: var(--text); font-family: var(--display); font-size: 19px; }
    .mini-track { height: 4px; margin-top: 11px; overflow: hidden; border-radius: 99px; background: var(--panel-3); }
    .mini-track div { height: 100%; border-radius: inherit; background: var(--accent); }
    .matrix-wrap { overflow-x: auto; padding-bottom: 4px; }
    .matrix { width: 100%; min-width: 440px; table-layout: fixed; border-collapse: separate; border-spacing: 4px; font-family: var(--display); font-size: 13px; text-align: center; }
    .matrix th { height: 26px; color: var(--muted-2); font-weight: 600; }
    .matrix td { height: 38px; border: 1px solid rgba(255,255,255,.04); border-radius: 6px; color: #eaf2e7; background: rgba(200,244,90,var(--heat)); }
    .matrix-note { margin: 9px 0 0; color: var(--muted-2); font-family: var(--font); font-size: 10px; text-align: right; }

  <script>
    (() => {

      const STORAGE_KEY = 'matchday-favorites-v1';
      const teamMeta = {
        'Arsenal': ['阿森纳','ARS','#d71920'], 'Chelsea': ['切尔西','CHE','#034694'],
        'Man City': ['曼城','MCI','#6cabdd'], 'Liverpool': ['利物浦','LIV','#c8102e'],
        'Tottenham': ['热刺','TOT','#26366f'], 'Man United': ['曼联','MUN','#da291c'],
        'Newcastle': ['纽卡斯尔','NEW','#4b5560'], 'Aston Villa': ['阿斯顿维拉','AVL','#7b2747'],
        'Brighton': ['布莱顿','BHA','#0057b8'], 'West Ham': ['西汉姆联','WHU','#7a263a'],

        "Nott'm Forest": ['诺丁汉森林','NFO','#c92332'], 'Leicester': ['莱斯特城','LEI','#003090'],
        'Ipswich': ['伊普斯维奇','IPS','#3a64a3'], 'Southampton': ['南安普顿','SOU','#c82c35'],
        'Sunderland': ['桑德兰','SUN','#c7353c'], 'Leeds': ['利兹联','LEE','#c5b85c'],
        'Burnley': ['伯恩利','BUR','#6c1d45'], 'Luton': ['卢顿','LUT','#d66b23'],
        'Watford': ['沃特福德','WAT','#b59b22'], 'Sheffield United': ['谢菲尔德联','SHU','#c82b35'],
        'Norwich': ['诺维奇','NOR','#7c9a35']
      };
      const state = { matches: [], hourly: null, filter: 'all', date: 'all', query: '', favorites: new Set(), loading: false };
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const pct = value => `${((Number(value) || 0) * 100).toFixed(1)}%`;
      const meta = team => teamMeta[team] || [team, team.split(/\s+/).map(x => x[0]).join('').slice(0,3).toUpperCase(), '#627268'];
      const cn = team => meta(team)[0];
      const badge = (team, large = false) => { const m = meta(team); return `<span class="club-badge${large ? ' large' : ''}" style="--club:${m[2]}" aria-hidden="true">${esc(m[1])}</span>`; };
      const loadFavorites = () => { try { state.favorites = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); } catch (_) { state.favorites = new Set(); } };
      const saveFavorites = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.favorites])); } catch (_) {} };
      let toastTimer, lastFocused = null;
      function toast(message) { const el = $('#toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }
      async function fetchJSON(path) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 22000);
        try {
          const response = await fetch(API + path, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
          if (!response.ok) throw new Error(`服务返回 ${response.status}`);
          return await response.json();
        } finally { clearTimeout(timer); }
      }
      function shanghaiDateKey(value) {
        if (!value) return 'unscheduled';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'unscheduled';
        const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
        const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
        return `${p.year}-${p.month}-${p.day}`;
      }
      function localDateKey(date) {
        const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
        const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
        return `${p.year}-${p.month}-${p.day}`;
      }
      function kickoffText(match, long = false) {
        if (!match.kickoff) return long ? '开球时间待定' : '待定';
        const date = new Date(match.kickoff);
        if (Number.isNaN(date.getTime())) return long ? '开球时间待定' : '待定';
        return new Intl.DateTimeFormat('zh-CN', long ? { timeZone: 'Asia/Shanghai', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false } : { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
      }
      function dateLabel(key) {
        const date = new Date(`${key}T12:00:00+08:00`);
        return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'long', day: 'numeric', weekday: 'long' }).format(date);
      }
      function isLive(match) { return String(match.status_state || '').toLowerCase() === 'in'; }
      function matchName(match) { return `${cn(match.match.home_team)} vs ${cn(match.match.away_team)}`; }
      function renderDates() {
        const days = [{ key: 'all', day: '全部赛程', num: 'ALL' }];
        const now = new Date();
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        for (let i = 0; i < 7; i++) {
          const date = new Date(now.getTime() + i * 86400000);
          days.push({ key: localDateKey(date), day: i === 0 ? '今天' : i === 1 ? '明天' : weekdays[date.getDay()], num: `${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}` });
        }
        $('#dateStrip').innerHTML = days.map(d => `<button class="date-btn${state.date === d.key ? ' active' : ''}" data-date="${d.key}" aria-pressed="${state.date === d.key}"><span class="date-day">${d.day}</span><span class="date-num num">${d.num}</span></button>`).join('');
      }
      function filteredMatches() {
        const q = state.query.trim().toLowerCase();
        return state.matches.filter(match => {
          if (state.date !== 'all' && shanghaiDateKey(match.kickoff) !== state.date) return false;
          if (state.filter === 'favorites' && !state.favorites.has(match.id)) return false;
          if (q) {
            const home = match.match.home_team, away = match.match.away_team;
            const haystack = [home, away, cn(home), cn(away), meta(home)[1], meta(away)[1]].join(' ').toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      }
      function probMarkup(match) {
        const p = match.probabilities_1x2 || {};
        const items = [['主胜',p.home_win],['平局',p.draw],['客胜',p.away_win]];
        const max = Math.max(...items.map(x => Number(x[1]) || 0));
        return `<div class="probabilities" aria-label="赛果概率">${items.map(([label,value]) => `<div class="prob-item${Number(value) === max ? ' fav' : ''}"><span class="prob-label">${label}</span><strong class="prob-value">${pct(value)}</strong></div>`).join('')}</div>`;
      }
      function fixtureRow(match) {
        const home = match.match.home_team, away = match.match.away_team;
        const live = isLive(match);
        const score = match.actual_score && typeof match.actual_score === 'object' ? `${match.actual_score.home ?? 0} - ${match.actual_score.away ?? 0}` : '';
        return `<article class="fixture-row" data-match="${esc(match.id)}" tabindex="0" role="button" aria-label="查看 ${esc(matchName(match))} 预测详情">

        </article>`;

      function renderFixtures() {
        const matches = filteredMatches();
        $('#matchCount').textContent = `${matches.length} 场比赛`;
        if (!matches.length) {
          const isSearch = !!state.query.trim();
          $('#fixturesContent').innerHTML = `<div class="state-box"><div class="state-icon">${icon(isSearch ? 'search' : 'calendar')}</div><h2 class="state-title">${isSearch ? '没有找到相关对阵' : state.filter === 'favorites' ? '还没有收藏比赛' : '该日期暂无赛程'}</h2><button class="ghost-btn" id="resetFilters">查看全部比赛</button></div>`;

        const groups = new Map();

        const ordered = [...groups.entries()].sort(([a],[b]) => a === 'unscheduled' ? 1 : b === 'unscheduled' ? -1 : a.localeCompare(b));

      function matrixMarkup(match) {
        const matrix = match.score_matrix || [];
        const size = Math.min(6, matrix.length);
        if (!size) return '';

        for (let row=0; row<size; row++) {

          for (let col=0; col<size; col++) {

        return html + '</tbody></table></div>';

      function openMatch(id) {

        const home = match.match.home_team, away = match.match.away_team;
        const p = match.probabilities_1x2 || {}, xg = match.expected_goals || {}, ou = match.over_under || {}, btts = match.btts || {};

          <section class="dialog-section"><h2 class="dialog-section-title">进球市场</h2><div class="market-grid">
            <div class="market-item"><div class="market-top"><span>总进球大于 2.5</span><strong>${pct(ou.over_2_5)}</strong></div><div class="mini-track"><div style="width:${(ou.over_2_5||0)*100}%"></div></div></div>
            <div class="market-item"><div class="market-top"><span>双方均有进球</span><strong>${pct(btts.yes)}</strong></div><div class="mini-track"><div style="width:${(btts.yes||0)*100}%"></div></div></div>
          </div></section>
          <section class="dialog-section"><h2 class="dialog-section-title">比分概率矩阵</h2>${matrixMarkup(match)}</section>`;
        const dialog = $('#matchDialog');
        lastFocused = document.activeElement;
        dialog.hidden = false;
        document.body.style.overflow = 'hidden';
        $('#closeDialog').focus();
      }
      function closeMatch() {
        const dialog = $('#matchDialog');
        dialog.hidden = true;
        document.body.style.overflow = '';
        if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
      }
      function setLoading(loading) { state.loading = loading; }
      function setService(online, text) { $('#servicePill').classList.toggle('offline', !online); $('#serviceText').textContent = text; }
      async function loadData(showMessage = false) {
        if (state.loading) return;
        setLoading(true);
        setService(false, '同步中');
        try {
          const hourly = await fetchJSON('/hourly');
          state.hourly = hourly;
          state.matches = Array.isArray(hourly.matches) ? hourly.matches : [];
          renderFixtures();
          setService(true, '在线');
          if (showMessage) toast('赛程已更新');
        } catch (error) {
          console.error(error);
          setService(false, '离线');
          $('#matchCount').textContent = '暂时离线';
          $('#fixturesContent').innerHTML = `<div class="state-box"><div class="state-icon">${icon('refresh')}</div><h2 class="state-title">赛程暂时无法加载</h2><button class="ghost-btn" id="retryLoad">重新加载</button></div>`;
        } finally { setLoading(false); }
      }

      loadFavorites();
      renderDates();
      loadData();

      $('#dateStrip').addEventListener('click', event => { const btn = event.target.closest('[data-date]'); if (!btn) return; state.date = btn.dataset.date; renderDates(); renderFixtures(); });
      $$('.filter-tab').forEach(btn => btn.addEventListener('click', () => { state.filter = btn.dataset.filter; $$('.filter-tab').forEach(x => { x.classList.toggle('active', x === btn); x.setAttribute('aria-selected', x === btn); }); renderFixtures(); }));
      $('#fixturesContent').addEventListener('click', event => {
        const fav = event.target.closest('[data-favorite]');
        if (fav) {
          event.stopPropagation();
          const id = fav.dataset.favorite;
          if (state.favorites.has(id)) { state.favorites.delete(id); toast('已取消收藏'); } else { state.favorites.add(id); toast('已加入我的收藏'); }
          saveFavorites(); renderFixtures(); return;
        }
        if (event.target.closest('#retryLoad')) { loadData(true); return; }
        if (event.target.closest('#resetFilters')) { state.filter = 'all'; state.date = 'all'; state.query = ''; $('#searchInput').value = ''; $$('.filter-tab').forEach(x => { const active = x.dataset.filter === 'all'; x.classList.toggle('active',active); x.setAttribute('aria-selected',active); }); renderDates(); renderFixtures(); return; }
        const row = event.target.closest('[data-match]'); if (row) openMatch(row.dataset.match);
      });
      $('#fixturesContent').addEventListener('keydown', event => { if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-match]')) { event.preventDefault(); openMatch(event.target.dataset.match); } });
      $('#closeDialog').addEventListener('click', closeMatch);
      $('#matchDialog').addEventListener('click', event => { if (event.target === $('#matchDialog')) closeMatch(); });
      $('#searchInput').addEventListener('input', event => { state.query = event.target.value; renderFixtures(); });
      $('#searchBox').addEventListener('click', () => { if (window.innerWidth <= 620 && !$('#searchBox').classList.contains('expanded')) { $('#searchBox').classList.add('expanded'); $('#searchInput').focus(); } });
      document.addEventListener('click', event => { if (window.innerWidth <= 620 && !event.target.closest('#searchBox') && !state.query) $('#searchBox').classList.remove('expanded'); });
      document.addEventListener('keydown', event => {
        if (event.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { event.preventDefault(); $('#searchBox').classList.add('expanded'); $('#searchInput').focus(); }
        if (event.key === 'Escape' && !$('#matchDialog').hidden) { closeMatch(); return; }
        if (event.key === 'Escape' && document.activeElement === $('#searchInput')) { $('#searchInput').blur(); if (!state.query) $('#searchBox').classList.remove('expanded'); }
      });
    })();
  </script>
</body>
</html>
