<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛事 — 连珠网</title>
  <link rel="stylesheet" href="css/site.css?v=12" />
</head>
<body>
  <header id="top">
    <div class="site-title-nav">
      <a href="index.html" class="site-name"><strong>连珠网</strong></a>
      <nav id="topnav" aria-label="主导航">
        <a class="active" href="index.html">赛事</a>
        <a href="players.html">棋手</a>
        <a href="model.html">模型</a>
      </nav>
    </div>
  </header>

  <main id="main-wrap" class="is-narrow">
    <div id="primaryContent" class="box">
      <div class="swiss__main__header">
        <div class="swiss__header-left">
          <h1>赛事</h1>
        </div>
      </div>
      <div class="swiss__controls">
        <div class="round-pick year-pick">
          <button type="button" class="round-nav" id="yearPrev" aria-label="上一年">&lt;</button>
          <select id="yearSelect" aria-label="选择年份"></select>
          <button type="button" class="round-nav" id="yearNext" aria-label="下一年">&gt;</button>
        </div>
      </div>
      <div class="slist-wrapper">
        <table class="slist" data-feed="tournaments">
          <tbody>
            <tr>
              <th>日期</th>
              <th>赛事</th>
              <th>人数</th>
              <th>对局数</th>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/app.js?v=12"></script>
</body>
</html>
