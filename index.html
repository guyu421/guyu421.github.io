<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="MATCHDAY 英超赛程与预测。">

  <title>MATCHDAY — 英超赛程</title>
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link rel="preconnect" href="https://a.espncdn.com">
  <link href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #fff;
      --soft: #f7f8fa;
      --line: #eceef1;
      --text: #25282c;
      --muted: #9298a1;
      --accent: #e84438;
      --accent-soft: #fff1ef;
      --blue: #607c9e;
      --radius: 12px;
      --font: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      --display: "Barlow Condensed", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .container { width: min(1040px, calc(100% - 40px)); margin: 0 auto; }
    .num { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* 顶部 */
    .topbar { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(16px); }
    .topbar-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: #fff; background: var(--accent); }
    .brand-mark .icon { width: 20px; height: 20px; stroke-width: 2; }
    .brand-name { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: .3px; }
    .brand-name span { color: var(--accent); }
    .search-box { width: 218px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid transparent; border-radius: 8px; color: var(--muted); background: var(--soft); }
    .search-box:focus-within { border-color: rgba(232,68,56,.35); background: #fff; }
    .search-box input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 12px; }
    .search-box input::placeholder { color: #a5aab1; }

    /* 标题与日期 */
    .league-head { padding: 27px 0 20px; }
    h1 { margin: 0; font-size: 27px; line-height: 1.25; letter-spacing: -.5px; }
    .date-wrap { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
    .date-strip { display: grid; grid-template-columns: 1.1fr repeat(7,1fr); gap: 7px; padding: 11px 0; }
    .date-btn { height: 54px; min-width: 0; border: 0; border-radius: 8px; background: transparent; color: #777e87; }
    .date-btn:hover { background: var(--soft); color: var(--text); }
    .date-btn.active { color: #fff; background: var(--accent); }
    .date-day { display: block; font-size: 11px; font-weight: 500; }
    .date-num { display: block; margin-top: 3px; font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1; }

    /* 赛程列表 */
    .schedule-layout { padding: 22px 0 42px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 2px 8px rgba(28,35,43,.025); }
    .fixture-toolbar { min-height: 57px; display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .filter-tabs { display: flex; align-items: center; align-self: stretch; gap: 26px; }
    .filter-tab { position: relative; border: 0; padding: 0 2px; background: transparent; color: #858b93; font-size: 14px; font-weight: 600; }
    .filter-tab.active { color: var(--accent); }
    .filter-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
    .match-count { margin-left: auto; color: #a0a5ac; font-size: 11px; }
    .group-head { padding: 15px 20px 9px; background: #fafbfc; }
    .group-title { display: flex; align-items: center; gap: 7px; margin: 0; color: #6f757e; font-size: 12px; font-weight: 500; }
    .group-title .icon { width: 14px; height: 14px; }
    .fixture-list { padding: 0 18px; }
    .fixture-row { display: grid; grid-template-columns: 116px minmax(240px,1fr) 224px; align-items: center; gap: 18px; min-height: 104px; border-top: 1px solid var(--line); cursor: pointer; transition: background .16s; }
    .group-head + .fixture-list .fixture-row:first-child, .fixture-list .fixture-row:first-child { border-top: 0; }
    .fixture-row:hover { background: #fcfcfd; }
    .fixture-row.static { cursor: default; }
    .kickoff { padding-left: 4px; }
    .kickoff-time { font-family: var(--display); font-size: 23px; font-weight: 700; line-height: 1.2; letter-spacing: .5px; }
    .teams-stack { display: grid; gap: 11px; min-width: 0; }
    .team-line { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .team-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
    .team-score { margin-left: auto; font-family: var(--display); font-size: 20px; font-weight: 700; }
    .club-logo-box { position: relative; flex: 0 0 auto; width: 30px; height: 32px; display: grid; place-items: center; }
    .club-logo { position: relative; z-index: 1; width: 29px; height: 29px; object-fit: contain; }
    .club-logo-box.large { width: 64px; height: 68px; }
    .club-logo-box.large .club-logo { width: 62px; height: 62px; }
    .club-badge { --club: #8b949c; position: absolute; inset: 0; display: grid; place-items: center; color: #7d858e; background: transparent; font-family: var(--display); font-size: 11px; font-weight: 800; }
    .club-logo-box.large .club-badge { border-radius: 15px; font-size: 21px; }
    .probabilities { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .prob-item { padding: 7px 3px; border-radius: 7px; text-align: center; background: var(--soft); }
    .prob-item.fav { background: var(--accent-soft); }
    .prob-label { display: block; color: #9ba0a7; font-size: 9px; }
    .prob-value { display: block; margin-top: 2px; font-family: var(--display); font-size: 18px; font-weight: 700; }
    .prob-item.fav .prob-value { color: var(--accent); }
    .match-state { justify-self: end; padding-right: 8px; color: #969ca4; font-size: 12px; }
    .load-more { padding: 17px; border-top: 1px solid var(--line); text-align: center; }
    .load-more button, .ghost-btn { min-height: 35px; padding: 0 17px; border: 1px solid var(--line); border-radius: 8px; color: #707780; background: #fff; font-size: 12px; }
    .load-more button:hover, .ghost-btn:hover { color: var(--accent); border-color: rgba(232,68,56,.35); }
    .state-box { display: grid; justify-items: center; padding: 62px 20px; text-align: center; }
    .state-icon { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 14px; border-radius: 12px; color: #9da3ab; background: var(--soft); }
    .state-title { margin: 0 0 17px; font-size: 14px; font-weight: 500; }

    /* 单场预测页 */
    .match-page { padding: 22px 0 42px; }
    .match-page[hidden], .fixtures-view[hidden] { display: none; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; border: 0; padding: 6px 0; color: #777e87; background: transparent; font-size: 12px; }
    .back-btn:hover { color: var(--accent); }
    .match-detail { padding: 25px; }
    .dialog-teams { display: grid; grid-template-columns: 1fr 110px 1fr; align-items: center; gap: 16px; padding: 7px 0 26px; text-align: center; }
    .dialog-team { display: grid; justify-items: center; gap: 12px; }
    .dialog-team-name { font-size: 16px; font-weight: 600; }
    .dialog-team-en { margin-top: 3px; color: #a0a5ac; font-family: var(--display); font-size: 12px; letter-spacing: .6px; }
    .dialog-vs { font-family: var(--display); font-size: 29px; font-weight: 700; }
    .dialog-time { margin-top: 6px; color: #9298a1; font-size: 10px; }
    .dialog-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
    .dialog-section-title { margin: 0 0 14px; font-size: 13px; }
    .xg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .xg-card { padding: 15px; border-radius: 10px; background: var(--soft); }
    .xg-label { color: #858c94; font-size: 11px; }
    .xg-value { margin-top: 4px; font-family: var(--display); font-size: 31px; font-weight: 700; }
    .outcome-values { display: grid; grid-template-columns: repeat(3,1fr); margin-bottom: 12px; text-align: center; }
    .outcome-values span { display: block; color: #8d939b; font-size: 10px; }
    .outcome-values strong { display: block; margin-top: 4px; font-family: var(--display); font-size: 25px; }
    .outcome-bar { display: flex; height: 7px; gap: 3px; overflow: hidden; border-radius: 99px; }
    .outcome-bar div { min-width: 2px; }
    .outcome-home { background: var(--accent); }
    .outcome-draw { background: #c4c9ce; }
    .outcome-away { background: var(--blue); }
    .scoreline-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .scoreline-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border-radius: 9px; background: var(--soft); }
    .scoreline-item strong { font-family: var(--display); font-size: 22px; }
    .scoreline-item span { color: var(--accent); font-family: var(--display); font-size: 16px; }
    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .market-item { padding: 13px 15px; border-radius: 9px; background: var(--soft); }
    .market-top { display: flex; justify-content: space-between; color: #858c94; font-size: 11px; }
    .market-top strong { color: var(--text); font-family: var(--display); font-size: 18px; }
    .mini-track { height: 4px; margin-top: 10px; overflow: hidden; border-radius: 99px; background: #e5e8eb; }
    .mini-track div { height: 100%; border-radius: inherit; background: var(--accent); }
    .matrix-wrap { overflow-x: auto; padding-bottom: 3px; }
    .matrix { width: 100%; min-width: 430px; table-layout: fixed; border-collapse: separate; border-spacing: 4px; font-family: var(--display); font-size: 13px; text-align: center; }
    .matrix th { height: 25px; color: #9ba1a8; font-weight: 500; }
    .matrix td { height: 36px; border-radius: 5px; color: #4b5056; background: rgba(232,68,56,var(--heat)); }
    .toast { position: fixed; left: 50%; bottom: 25px; z-index: 60; transform: translate(-50%,12px); padding: 10px 16px; border-radius: 8px; color: #fff; background: #33383e; font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 760px) {
      .container { width: calc(100% - 24px); }
      .date-strip { overflow-x: auto; grid-template-columns: repeat(8,78px); scrollbar-width: none; }
      .date-strip::-webkit-scrollbar { display: none; }
      .fixture-row { grid-template-columns: 90px minmax(180px,1fr) 185px; gap: 12px; }
    }
    @media (max-width: 560px) {
      .container { width: 100%; }
      .topbar-inner { padding: 0 14px; }
      .brand-name { font-size: 22px; }
      .search-box { width: 38px; padding: 0; justify-content: center; background: transparent; }
      .search-box input { display: none; }
      .search-box.expanded { position: absolute; left: 12px; right: 12px; top: 13px; z-index: 2; width: auto; padding: 0 11px; justify-content: flex-start; border-color: rgba(232,68,56,.3); background: #fff; }
      .search-box.expanded input { display: block; }
      .league-head { padding: 22px 16px 16px; }
      h1 { font-size: 23px; }
      .date-strip { padding: 9px 12px; grid-template-columns: repeat(8,71px); gap: 4px; }
      .date-btn { height: 51px; }
      .schedule-layout { padding: 12px 0 25px; }
      .panel { border-left: 0; border-right: 0; border-radius: 0; }
      .fixture-toolbar { padding: 0 16px; }
      .group-head { padding: 13px 16px 8px; }
      .fixture-list { padding: 0 14px; }
      .fixture-row { grid-template-columns: 77px minmax(0,1fr); gap: 9px; min-height: 100px; }
      .kickoff-time { font-size: 21px; }
      .team-line { gap: 10px; }
      .team-name { font-size: 13px; }
      .probabilities { display: none; }
      .match-state { display: none; }
      .match-page { padding: 12px 0 25px; }
      .back-btn { margin-left: 14px; }
      .match-detail { padding: 18px 14px; }
      .dialog-teams { grid-template-columns: 1fr 58px 1fr; gap: 6px; }
      .dialog-team-name { font-size: 14px; }
      .club-logo-box.large { width: 54px; height: 58px; }
      .club-logo-box.large .club-logo { width: 52px; height: 52px; }
      .scoreline-grid { grid-template-columns: repeat(2,1fr); }
      .market-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>

      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const pct = value => `${((Number(value) || 0) * 100).toFixed(1)}%`;
      const meta = team => teamMeta[team] || [team, team.split(/\s+/).map(x => x[0]).join('').slice(0,3).toUpperCase(), '#7e8992'];
      const cn = team => state.teamNames[team] || meta(team)[0];
      const safeLogo = url => typeof url === 'string' && /^https:\/\/[a-z0-9.-]+\//i.test(url) ? url : '';
      function badge(team, logo = '', large = false) {
        const m = meta(team), url = safeLogo(logo);
        if (!url) return `<span class="club-logo-box${large ? ' large' : ''}"><span class="club-badge" style="--club:${m[2]}">${esc(m[1])}</span></span>`;
        return `<span class="club-logo-box${large ? ' large' : ''}"><img class="club-logo" src="${esc(url)}" alt="${esc(cn(team))}队标" onerror="this.remove()"></span>`;
      }
      let toastTimer;
      function toast(message) { const el = $('#toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000); }
      async function dbGet(path) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 25000);
        try {
          const response = await fetch(DB + path, { signal: controller.signal, headers: { apikey: DB_KEY, Authorization: `Bearer ${DB_KEY}`, Accept: 'application/json' } });
          if (!response.ok) throw new Error(`DB ${response.status}`);
          return await response.json();
        } finally { clearTimeout(timer); }
      }
      function shanghaiDateKey(value) {
        if (!value) return 'unscheduled';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'unscheduled';
        const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
        const p = Object.fromEntries(parts.map(x => [x.type,x.value]));
        return `${p.year}-${p.month}-${p.day}`;
      }
      function localDateKey(date) { return shanghaiDateKey(date.toISOString()); }
      function fullDateTime(value) {
        if (!value) return '时间待定';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '时间待定';
        return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(date).replaceAll('/', '-');
      }
      function timeOnly(value) {
        if (!value) return '--:--';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '--:--';
        return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
      }
      function dateLabel(key) {
        if (key === 'unscheduled') return '日期待定';
        return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'long', day: 'numeric', weekday: 'long' }).format(new Date(`${key}T12:00:00+08:00`));
      }
      function matchName(match) { return `${cn(match.match.home_team)} vs ${cn(match.match.away_team)}`; }
      function scoreText(match) {
        if (match.actual_score && match.actual_score.home != null) return `${match.actual_score.home} - ${match.actual_score.away}`;
        return '';
      }
      function renderDates() {
        const days = [{ key: 'all', day: '全部', num: 'ALL' }], now = new Date(), weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        for (let i=0; i<7; i++) {
          const date = new Date(now.getTime() + i * 86400000);
          days.push({ key: localDateKey(date), day: i === 0 ? '今天' : i === 1 ? '明天' : weekdays[date.getDay()], num: `${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}` });
        }
        $('#dateStrip').innerHTML = days.map(d => `<button class="date-btn${state.date === d.key ? ' active' : ''}" data-date="${d.key}" aria-pressed="${state.date === d.key}"><span class="date-day">${d.day}</span><span class="date-num num">${d.num}</span></button>`).join('');
      }
      function filteredMatches() {
        const q = state.query.trim().toLowerCase();
        return state.matches.filter(match => {
          const isResult = match.status_state === 'post';
          if (state.filter === 'results' ? !isResult : isResult) return false;
          if (state.date !== 'all' && shanghaiDateKey(match.kickoff) !== state.date) return false;
          if (q) {
            const home = match.match.home_team, away = match.match.away_team;
            const text = [home,away,cn(home),cn(away),meta(home)[1],meta(away)[1]].join(' ').toLowerCase();
            if (!text.includes(q)) return false;
          }
          return true;
        }).sort((a,b) => {
          const diff = new Date(a.kickoff || 0) - new Date(b.kickoff || 0);
          return state.filter === 'results' ? -diff : diff;
        });
      }
      function probMarkup(match) {
        if (!match.hasPrediction) return `<span class="match-state">${match.status_state === 'post' ? '已结束' : match.status_state === 'in' ? '进行中' : '未开始'}</span>`;
        if (match.status_state === 'post') return '<span class="match-state">已结束</span>';
        const p = match.probabilities_1x2, items = [['主胜',p.home_win],['平局',p.draw],['客胜',p.away_win]], max = Math.max(...items.map(x => Number(x[1]) || 0));
        return `<div class="probabilities" aria-label="赛果概率">${items.map(([label,value]) => `<div class="prob-item${Number(value) === max ? ' fav' : ''}"><span class="prob-label">${label}</span><strong class="prob-value">${pct(value)}</strong></div>`).join('')}</div>`;
      }
      function fixtureRow(match) {
        const home = match.match.home_team, away = match.match.away_team, score = scoreText(match), clickable = match.hasPrediction;
        return `<article class="fixture-row${clickable ? '' : ' static'}" ${clickable ? `data-match="${esc(match.id)}" tabindex="0" role="button" aria-label="查看 ${esc(matchName(match))} 预测"` : ''}>
          <div class="kickoff"><div class="kickoff-time num">${esc(timeOnly(match.kickoff))}</div></div>
          <div class="teams-stack">
            <div class="team-line">${badge(home,match.match.home_logo)}<span class="team-name">${esc(cn(home))}</span>${score ? `<span class="team-score">${esc(match.actual_score.home)}</span>` : ''}</div>
            <div class="team-line">${badge(away,match.match.away_logo)}<span class="team-name">${esc(cn(away))}</span>${score ? `<span class="team-score">${esc(match.actual_score.away)}</span>` : ''}</div>
          </div>
          ${probMarkup(match)}
        </article>`;
      }
      function renderFixtures() {
        const matches = filteredMatches();
        $('#matchCount').textContent = `${matches.length} 场`;
        if (!matches.length) {
          $('#fixturesContent').innerHTML = `<div class="state-box"><div class="state-icon">${icon(state.query ? 'search' : 'calendar')}</div><h2 class="state-title">${state.query ? '没有找到相关球队' : '暂无比赛'}</h2><button class="ghost-btn" id="resetFilters">查看全部</button></div>`;
          return;
        }
        const visible = matches.slice(0,state.visibleLimit), groups = new Map();
        visible.forEach(match => { const key = shanghaiDateKey(match.kickoff); if (!groups.has(key)) groups.set(key,[]); groups.get(key).push(match); });
        $('#fixturesContent').innerHTML = [...groups.entries()].map(([key,items]) => `<section><div class="group-head"><h2 class="group-title">${icon('calendar')}${dateLabel(key)}</h2></div><div class="fixture-list">${items.map(fixtureRow).join('')}</div></section>`).join('') + (matches.length > visible.length ? '<div class="load-more"><button id="loadMore">加载更多</button></div>' : '');
      }
      function matrixMarkup(match) {
        const matrix = match.score_matrix || [], size = Math.min(6,matrix.length);
        if (!size) return '';
        let html = '<div class="matrix-wrap"><table class="matrix"><thead><tr><th>主\\客</th>';
        for (let col=0; col<size; col++) html += `<th>${col}</th>`;
        html += '</tr></thead><tbody>';
        for (let row=0; row<size; row++) {
          html += `<tr><th>${row}</th>`;
          for (let col=0; col<size; col++) {
            const value = Number(matrix[row]?.[col]) || 0, heat = Math.min(.34,value*2.8).toFixed(2);
            html += `<td style="--heat:${heat}" title="${row}-${col}：${pct(value)}">${(value*100).toFixed(1)}</td>`;
          }
          html += '</tr>';
        }
        return html + '</tbody></table></div>';
      }
      function renderMatchPage(match) {
        const home = match.match.home_team, away = match.match.away_team, p = match.probabilities_1x2, xg = match.expected_goals, ou = match.over_under, btts = match.btts;
        $('#matchPageContent').innerHTML = `<div class="dialog-teams">
          <div class="dialog-team">${badge(home,match.match.home_logo,true)}<div class="dialog-team-name">${esc(cn(home))}</div></div>
          <div><div class="dialog-vs">${esc(scoreText(match) || 'VS')}</div><div class="dialog-time">${esc(fullDateTime(match.kickoff))}</div></div>
          <div class="dialog-team">${badge(away,match.match.away_logo,true)}<div class="dialog-team-name">${esc(cn(away))}</div></div>
        </div>
        <section><h2 class="dialog-section-title">预期进球</h2><div class="xg-grid"><div class="xg-card"><div class="xg-label">${esc(cn(home))}</div><div class="xg-value">${Number(xg.home || 0).toFixed(2)}</div></div><div class="xg-card"><div class="xg-label">${esc(cn(away))}</div><div class="xg-value">${Number(xg.away || 0).toFixed(2)}</div></div></div></section>
        <section class="dialog-section"><h2 class="dialog-section-title">赛果概率</h2><div class="outcome-values"><div><span>主胜</span><strong style="color:var(--accent)">${pct(p.home_win)}</strong></div><div><span>平局</span><strong>${pct(p.draw)}</strong></div><div><span>客胜</span><strong style="color:var(--blue)">${pct(p.away_win)}</strong></div></div><div class="outcome-bar"><div class="outcome-home" style="width:${(p.home_win||0)*100}%"></div><div class="outcome-draw" style="width:${(p.draw||0)*100}%"></div><div class="outcome-away" style="width:${(p.away_win||0)*100}%"></div></div></section>
        <section class="dialog-section"><h2 class="dialog-section-title">最可能比分</h2><div class="scoreline-grid">${(match.top_scorelines || []).slice(0,6).map(s => `<div class="scoreline-item"><strong>${esc(s.score)}</strong><span>${pct(s.probability)}</span></div>`).join('')}</div></section>
        <section class="dialog-section"><h2 class="dialog-section-title">进球市场</h2><div class="market-grid"><div class="market-item"><div class="market-top"><span>总进球大于 2.5</span><strong>${pct(ou.over_2_5)}</strong></div><div class="mini-track"><div style="width:${(ou.over_2_5||0)*100}%"></div></div></div><div class="market-item"><div class="market-top"><span>双方均有进球</span><strong>${pct(btts.yes)}</strong></div><div class="mini-track"><div style="width:${(btts.yes||0)*100}%"></div></div></div></div></section>
        <section class="dialog-section"><h2 class="dialog-section-title">比分概率矩阵</h2>${matrixMarkup(match)}</section>`;
      }
      function openMatch(id) { location.hash = `match=${encodeURIComponent(id)}`; }
      function handleRoute() {
        const id = new URLSearchParams(location.hash.slice(1)).get('match');
        const match = state.matches.find(m => String(m.id) === String(id));
        const showDetail = !!match?.hasPrediction;
        $('#fixturesView').hidden = showDetail;
        $('#matchPage').hidden = !showDetail;
        if (showDetail) {
          renderMatchPage(match);
          document.title = `${matchName(match)} — MATCHDAY`;
        } else {
          document.title = 'MATCHDAY — 英超赛程';
        }
        window.scrollTo(0,0);
      }
      async function loadData(showMessage = false) {
        if (state.loading) return;
        state.loading = true;
        try {
          const [teams,matches,predictions] = await Promise.all([
            dbGet('/football_teams?select=id,name,name_zh,logo&limit=200'),
            dbGet('/football_matches?select=id,league,round_no,match_time,status,home_team_id,away_team_id,home_score,away_score&order=match_time.asc&limit=3000'),
            dbGet('/football_predictions?select=match_id,xg_home,xg_away,p_home,p_draw,p_away,over_2_5,btts_yes,top_scorelines,score_matrix&limit=3000')
          ]);
          const teamMap = new Map(teams.map(t => [t.id,t])), predictionMap = new Map(predictions.map(p => [p.match_id,p]));
          teams.forEach(t => { state.teamNames[t.name] = t.name_zh || t.name; if (aliases[t.name]) state.teamNames[aliases[t.name]] = t.name_zh || aliases[t.name]; });
          state.matches = matches.filter(m => m.league === 'eng.1').map(m => {
            const h = teamMap.get(m.home_team_id) || {}, a = teamMap.get(m.away_team_id) || {}, p = predictionMap.get(m.id);
            return {
              id: String(m.id), kickoff: m.match_time, status_state: m.status, round: m.round_no,
              match: { home_team: h.name || '', away_team: a.name || '', home_logo: h.logo || '', away_logo: a.logo || '' },
              actual_score: m.home_score == null ? null : { home: m.home_score, away: m.away_score }, hasPrediction: !!p,
              expected_goals: p ? { home: Number(p.xg_home), away: Number(p.xg_away) } : {},
              probabilities_1x2: p ? { home_win: Number(p.p_home), draw: Number(p.p_draw), away_win: Number(p.p_away) } : {},
              over_under: p ? { over_2_5: Number(p.over_2_5) } : {}, btts: p ? { yes: Number(p.btts_yes) } : {},
              top_scorelines: p?.top_scorelines || [], score_matrix: p?.score_matrix || []
            };
          });
          renderFixtures();
          handleRoute();
          if (showMessage) toast('赛程已更新');
        } catch (error) {
          console.error(error);
          $('#matchCount').textContent = '';
          $('#fixturesContent').innerHTML = `<div class="state-box"><div class="state-icon">${icon('refresh')}</div><h2 class="state-title">赛程暂时无法加载</h2><button class="ghost-btn" id="retryLoad">重新加载</button></div>`;
        } finally { state.loading = false; }
      }

      renderDates();
      window.addEventListener('hashchange',handleRoute);
      $('#backFixtures').addEventListener('click',() => { location.hash = ''; });
      loadData();
      $('#dateStrip').addEventListener('click', event => { const btn = event.target.closest('[data-date]'); if (!btn) return; state.date = btn.dataset.date; state.visibleLimit = 40; renderDates(); renderFixtures(); });
      $$('.filter-tab').forEach(btn => btn.addEventListener('click', () => { state.filter = btn.dataset.filter; state.visibleLimit = 40; $$('.filter-tab').forEach(x => { const active = x === btn; x.classList.toggle('active',active); x.setAttribute('aria-selected',active); }); renderFixtures(); }));
      $('#fixturesContent').addEventListener('click', event => {
        if (event.target.closest('#retryLoad')) { loadData(true); return; }
        if (event.target.closest('#loadMore')) { state.visibleLimit += 40; renderFixtures(); return; }
        if (event.target.closest('#resetFilters')) { state.filter = 'schedule'; state.date = 'all'; state.query = ''; state.visibleLimit = 40; $('#searchInput').value = ''; $$('.filter-tab').forEach(x => { const active = x.dataset.filter === 'schedule'; x.classList.toggle('active',active); x.setAttribute('aria-selected',active); }); renderDates(); renderFixtures(); return; }
        const row = event.target.closest('[data-match]'); if (row) openMatch(row.dataset.match);
      });
      $('#fixturesContent').addEventListener('keydown', event => { if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-match]')) { event.preventDefault(); openMatch(event.target.dataset.match); } });
      $('#searchInput').addEventListener('input',event => { state.query = event.target.value; state.visibleLimit = 40; renderFixtures(); });
      $('#searchBox').addEventListener('click',() => { if (window.innerWidth <= 560 && !$('#searchBox').classList.contains('expanded')) { $('#searchBox').classList.add('expanded'); $('#searchInput').focus(); } });
      document.addEventListener('click',event => { if (window.innerWidth <= 560 && !event.target.closest('#searchBox') && !state.query) $('#searchBox').classList.remove('expanded'); });
      document.addEventListener('keydown',event => {
        if (event.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { event.preventDefault(); $('#searchBox').classList.add('expanded'); $('#searchInput').focus(); }
        if (event.key === 'Escape' && document.activeElement === $('#searchInput')) { $('#searchInput').blur(); if (!state.query) $('#searchBox').classList.remove('expanded'); }
      });
    })();
  </script>
</body>
</html>
