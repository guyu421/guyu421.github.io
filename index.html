<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赛事</title>
  <link href="css/default.css" rel="stylesheet" type="text/css" />
  <link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="outer">
    <div id="header"></div>
    <div id="menu">
      <ul>
        <li class="first"><a href="index.html">赛事</a></li>
        <li><a href="players.html">棋手</a></li>
      </ul>
    </div>
    <div id="content">
      <div id="primaryContentContainer">
        <div id="primaryContent">
          <h1>赛事</h1>
          <div class="round-pick year-pick">
            <button type="button" class="round-nav" id="yearPrev" aria-label="上一年">&lt;</button>
            <select id="yearSelect" aria-label="选择年份"></select>
            <span class="round-total" id="yearTotal"></span>
            <button type="button" class="round-nav" id="yearNext" aria-label="下一年">&gt;</button>
          </div>
          <div class="table-wrap">
            <table data-feed="tournaments">
              <tbody>
                <tr>
                  <th>日期</th>
                  <th>赛事</th>
                  <th>人数</th>
                  <th>对局数</th>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
