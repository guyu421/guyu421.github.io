<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后台管理</title>
  <link href="css/default.css" rel="stylesheet" type="text/css" />
  <link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="outer">
    <div id="header"></div>
    <div id="menu">
      <ul>
        <li class="first"><a href="index.html">赛事</a></li>
        <li><a href="players.html">棋手</a></li>
        <li><a href="model.html">模型</a></li>
      </ul>
    </div>
    <div id="content">
      <div id="primaryContentContainer">
        <div id="primaryContent">
          <h1>数据库后台管理</h1>

          <div class="admin-panel">
            <div class="admin-row">
              <label for="apiToken">服务器 API 密钥:</label>
              <input id="apiToken" type="password" placeholder="服务器管理密钥（仅保存在本地浏览器）" />
              <button type="button" id="saveApiTokenBtn">保存密钥</button>
              <span id="apiTokenStatus" class="admin-muted"></span>
            </div>
          </div>

          <div class="admin-panel">
            <div class="admin-row">
              <label for="tournamentSelect">加载已有赛事:</label>
              <select id="tournamentSelect">
                <option value="">-- 选择赛事 --</option>
              </select>
              <button type="button" id="loadTournamentBtn">加载到文本框</button>
              <button type="button" id="newTemplateBtn">新建赛事模板</button>
              <button type="button" id="cmdTemplateBtn">单条修改指令模板</button>
            </div>
            <div class="admin-row" style="margin-top:0.5em;">
              <label for="champTourSelect">夺冠概率赛事:</label>
              <select id="champTourSelect">
                <option value="0">全部有编号赛事</option>
              </select>
              <label for="champStageSelect">阶段:</label>
              <select id="champStageSelect">
                <option value="all">全部阶段（抽签前+首轮前+各轮）</option>
                <option value="pre,draw">抽签前 + 首轮前</option>
                <option value="pre">仅抽签前预测</option>
                <option value="draw">仅首轮前预测</option>
                <option value="rounds">仅各轮后</option>
                <option value="1">第 1 轮后</option>
                <option value="2">第 2 轮后</option>
                <option value="3">第 3 轮后</option>
                <option value="4">第 4 轮后</option>
                <option value="5">第 5 轮后</option>
                <option value="6">第 6 轮后</option>
                <option value="7">第 7 轮后</option>
                <option value="8">第 8 轮后</option>
                <option value="9">第 9 轮后</option>
                <option value="10">第 10 轮后</option>
              </select>
              <button type="button" id="calcChampBtn">计算夺冠概率</button>
            </div>
          </div>

          <div class="admin-editor-wrap">
            <div class="admin-editor-head">
              <span>编辑区（纯文本 `.txt`，支持新建/覆盖赛事或 `SET / DEL / RENAME / MERGE` 指令）</span>
              <span id="lineStats" class="admin-muted">0 行</span>
            </div>
            <textarea id="txtEditor" spellcheck="false" placeholder="在此输入或粘贴赛事/对局文本..."></textarea>
          </div>

          <div class="admin-actions">
            <button type="button" id="previewBtn" class="admin-btn-primary">解析预览</button>
            <button type="button" id="submitServerBtn" class="admin-btn-success">直接写入服务器数据库</button>
            <button type="button" id="downloadTxtBtn">下载 .txt</button>
            <button type="button" id="downloadDbBtn">下载数据库 (.zip)</button>
            <button type="button" id="clearBtn">清空</button>
          </div>

          <div id="statusBox" class="admin-status" style="display:none;"></div>
          <div id="previewBox" class="admin-preview" style="display:none;"></div>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
