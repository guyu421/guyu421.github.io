<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 — 连珠网</title>
  <link rel="stylesheet" href="css/site.css?v=12" />
</head>
<body>
  <header id="top">
    <div class="site-title-nav">
      <a href="index.html" class="site-name"><strong>连珠网</strong></a>
      <nav id="topnav" aria-label="主导航">
        <a href="index.html">赛事</a>
        <a href="players.html">棋手</a>
        <a href="model.html">模型</a>
      </nav>
    </div>
  </header>

  <main id="main-wrap">
    <div id="primaryContent" data-admin-page class="box box-pad">
      <h1>数据库后台管理</h1>

      <div class="admin-panel">
        <div class="admin-row">
          <label for="apiToken">服务器 API 密钥:</label>
          <input id="apiToken" type="password" placeholder="服务器管理密钥（仅保存在本地浏览器）" />
          <button type="button" id="saveApiTokenBtn">保存密钥</button>
          <span id="apiTokenStatus" class="admin-muted"></span>
        </div>
      </div>

      <div class="admin-panel">
        <div class="admin-row">
          <label for="tournamentSelect">加载已有赛事:</label>
          <select id="tournamentSelect">
            <option value="">-- 选择赛事 --</option>
          </select>
          <button type="button" id="loadTournamentBtn">加载到文本框</button>
          <button type="button" id="newTemplateBtn">新建赛事模板</button>
          <button type="button" id="cmdTemplateBtn">单条修改指令模板</button>
        </div>
      </div>

      <div class="admin-editor-wrap">
        <div class="admin-editor-head">
          <span>编辑区（纯文本 `.txt`，支持新建/覆盖赛事或 `SET / DEL / RENAME / MERGE` 指令）</span>
          <span id="lineStats" class="admin-muted">0 行</span>
        </div>
        <textarea id="txtEditor" spellcheck="false" placeholder="在此输入或粘贴赛事/对局文本..."></textarea>
      </div>

      <div class="admin-actions">
        <button type="button" id="previewBtn" class="admin-btn-primary">解析预览</button>
        <button type="button" id="submitServerBtn" class="admin-btn-success">直接写入服务器数据库</button>
        <button type="button" id="downloadTxtBtn">下载 .txt</button>
        <button type="button" id="downloadDbBtn">下载数据库 (.zip)</button>
        <button type="button" id="clearBtn">清空</button>
      </div>

      <div id="statusBox" class="admin-status" style="display:none;"></div>
      <div id="previewBox" class="admin-preview" style="display:none;"></div>
    </div>
  </main>
  <script src="js/admin.js?v=12"></script>
</body>
</html>
