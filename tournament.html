<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赛事对局</title>
  <link href="css/default.css" rel="stylesheet" type="text/css" />
  <link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="outer">
    <header id="header" class="top-nav">
      <div class="top-nav-in">
        <a href="index.html" class="brand"><span class="brand-hash">#</span> renjuonline</a>
        <a href="admin.html" class="nav-pill-btn">管理</a>
      </div>
    </header>
    <nav id="menu" class="tab-bar" aria-label="主导航">
      <div class="tab-bar-in">
        <ul>
          <li class="first"><a href="index.html" class="is-active">赛事</a></li>
          <li><a href="players.html">棋手</a></li>
          <li><a href="model.html">模型</a></li>
        </ul>
      </div>
    </nav>
    <div id="content">
      <div id="primaryContentContainer">
        <div id="primaryContent" data-tournament-page>
          <h1 id="tourName">赛事</h1>
          <div id="tourMeta"></div>
          <div class="round-pick">
            <button type="button" class="round-nav" id="roundPrev" aria-label="上一轮">&lt;</button>
            <select id="roundSelect" aria-label="选择轮次"></select>
            <span class="round-total" id="roundTotal"></span>
            <button type="button" class="round-nav" id="roundNext" aria-label="下一轮">&gt;</button>
          </div>
          <div class="table-wrap">
            <table class="tour-games">
              <tbody>
                <tr>
                  <th>日期</th>
                  <th>轮次</th>
                  <th>规则</th>
                  <th>假先</th>
                  <th>结果</th>
                  <th>假后</th>
                  <th>假先胜</th>
                  <th>和棋</th>
                  <th>假后胜</th>
                </tr>
              </tbody>
            </table>
            <div id="roundStandingsWrap" style="display:none; margin-top: 1.5em;">
              <h3 id="standingsTitle" style="margin-bottom: 0.6em;">本轮后积分与夺冠概率</h3>
              <table class="renju-table tour-standings">
                <tbody>
                  <tr>
                    <th>名次</th>
                    <th>姓名</th>
                    <th>积分</th>
                    <th>对手分</th>
                    <th>中间对手分</th>
                    <th>胜局数</th>
                    <th>夺冠概率</th>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
