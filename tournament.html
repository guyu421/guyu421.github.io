<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赛事对局</title>
  <link href="css/default.css" rel="stylesheet" type="text/css" />
  <link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="outer">
    <div id="header"></div>
    <div id="menu">
      <ul>
        <li class="first"><a href="index.html">赛事</a></li>
        <li><a href="players.html">棋手</a></li>
      </ul>
    </div>
    <div id="content">
      <div id="primaryContentContainer">
        <div id="primaryContent" data-tournament-page>
          <h1 id="tourName">赛事</h1>
          <div id="tourMeta"></div>
          <div class="round-pick">
            <label for="roundSelect">轮次</label>
            <select id="roundSelect"></select>
          </div>
          <div class="table-wrap">
            <table class="tour-games">
              <tbody>
                <tr>
                  <th>日期</th>
                  <th>轮次</th>
                  <th>规则</th>
                  <th>假先</th>
                  <th>结果</th>
                  <th>假后</th>
                  <th>假先胜</th>
                  <th>和棋</th>
                  <th>假后胜</th>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
