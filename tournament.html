<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛事对局 — renjuonline.top</title>
  <link rel="stylesheet" href="css/site.css?v=11" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-topbar">
        <a href="index.html" class="site-brand"><span class="site-brand-dot"></span>renjuonline.top</a>
      </div>
      <nav class="site-nav-tabs" aria-label="主导航">
        <a class="site-nav-tab active" href="index.html">赛事</a>
        <a class="site-nav-tab" href="players.html">棋手</a>
        <a class="site-nav-tab" href="model.html">模型</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div id="primaryContent" data-tournament-page>
      <div class="page-head">
        <h1 id="tourName">赛事</h1>
        <div id="tourMeta" class="page-meta"></div>
      </div>
      <div class="round-pick">
        <div class="round-pick-left">
          <button type="button" class="round-nav" id="roundPrev" aria-label="上一轮">‹</button>
          <select id="roundSelect" aria-label="选择轮次"></select>
          <span class="round-total" id="roundTotal"></span>
          <button type="button" class="round-nav" id="roundNext" aria-label="下一轮">›</button>
        </div>
        <div class="seg-bar" id="tourViewSeg" style="display:none;">
          <button type="button" class="seg-btn active" data-view="all">全部</button>
          <button type="button" class="seg-btn" data-view="games">对阵</button>
          <button type="button" class="seg-btn" data-view="standings">积分榜</button>
        </div>
      </div>

      <div id="tourFixturesWrap"></div>

      <div class="table-wrap" id="tourTeamTableWrap" style="display:none;">
        <table class="tour-games">
          <tbody>
            <tr>
              <th>日期</th>
              <th>轮次</th>
              <th>规则</th>
              <th>假先</th>
              <th>结果</th>
              <th>假后</th>
              <th>假先胜</th>
              <th>和棋</th>
              <th>假后胜</th>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="roundStandingsWrap" style="display:none;">
        <h3 id="standingsTitle" class="card-section-title">本轮后积分与夺冠概率</h3>
        <div class="table-wrap">
          <table class="renju-table tour-standings">
            <tbody>
              <tr>
                <th>名次</th>
                <th>姓名</th>
                <th>积分</th>
                <th>对手分</th>
                <th>中间对手分</th>
                <th>胜局数</th>
                <th>夺冠概率</th>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="js/app.js?v=11"></script>
</body>
</html>
