<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对局详情 — 连珠网</title>
  <link rel="stylesheet" href="css/site.css?v=12" />
</head>
<body>
  <header id="top">
    <div class="site-title-nav">
      <a href="index.html" class="site-name"><strong>连珠网</strong></a>
      <nav id="topnav" aria-label="主导航">
        <a class="active" href="index.html">赛事</a>
        <a href="players.html">棋手</a>
        <a href="model.html">模型</a>
      </nav>
    </div>
  </header>

  <main id="main-wrap" class="is-narrow">
    <div id="primaryContent" data-game-page class="box">
      <div class="swiss__main__header">
        <div class="swiss__header-left">
          <h1 id="gameTitle">对局详情</h1>
        </div>
      </div>
      <div id="gameMeta" class="game-meta"></div>
      <div class="board-wrap">
        <canvas id="renjuBoard" width="480" height="480"></canvas>
      </div>
      <div class="board-controls">
        <button type="button" id="btnFirst" title="开局">&lt;&lt;</button>
        <button type="button" id="btnPrev" title="上一手">&lt;</button>
        <span id="stepInfo" class="step-info">0 / 0</span>
        <button type="button" id="btnNext" title="下一手">&gt;</button>
        <button type="button" id="btnLast" title="终局">&gt;&gt;</button>
      </div>
    </div>
  </main>
  <script src="js/game.js?v=12"></script>
</body>
</html>
