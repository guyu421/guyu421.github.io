<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>模型</title>
  <link href="css/default.css" rel="stylesheet" type="text/css" />
  <link href="css/site.css?v=6" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="outer">
    <div id="header"></div>
    <div id="menu">
      <ul>
        <li class="first"><a href="index.html">赛事</a></li>
        <li><a href="players.html">棋手</a></li>
        <li><a href="model.html">模型</a></li>
      </ul>
    </div>
    <div id="content">
      <div id="primaryContentContainer">
        <div id="primaryContent">
          <h1>预测模型</h1>

          <div class="model-section">
            <h2>模型原理</h2>
            <p class="model-desc">严格不引入未来信息，逻辑回归模型直接输出<code>假先胜</code>、<code>和棋</code>、<code>假后胜</code>三分类概率。</p>
            <p class="model-desc">所用特征如下：</p>
            <ul class="model-list">
              <li>等级分差：<code>(r1 - r2) / 400</code></li>
              <li>双方等级分均值偏移：<code>(r1 + r2 - 3800) / 400</code></li>
              <li>标准差之和：<code>(std1 + std2) / 100</code></li>
              <li>标准差之差：<code>(std1 - std2) / 100</code></li>
              <li>历史交锋和棋偏移：<code>h2h_draw_delta</code></li>
              <li>比赛规则：<code>rule_*</code></li>
            </ul>
          </div>

          <div class="model-section">
            <h2>预测评估指标</h2>
            <div class="model-metrics" id="modelMetrics"></div>
            <div class="model-legend" id="modelLegend"></div>
            <div class="model-chart-wrap" id="modelChartWrap"></div>
          </div>

          <div class="model-section">
            <div class="model-legend" id="calLegend">
              <span class="model-legend-item">
                <span class="model-legend-dash"></span>
                <span>完美校准</span>
              </span>
              <span class="model-legend-item">
                <span class="model-legend-line" style="background:#2f6fcd;"></span>
                <span>假先胜</span>
              </span>
              <span class="model-legend-item">
                <span class="model-legend-line" style="background:#2d9d6f;"></span>
                <span>和棋</span>
              </span>
              <span class="model-legend-item">
                <span class="model-legend-line" style="background:#d96b27;"></span>
                <span>假后胜</span>
              </span>
            </div>
            <div class="model-chart-wrap" id="calChartWrap"></div>
          </div>
        </div>
      </div>
      <div class="clear"></div>
    </div>
  </div>
  <script src="js/model.js"></script>
</body>
</html>
